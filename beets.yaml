library: /config/beets.db
directory: /music

logging:
  file: ~/.config/beets/beets.log
  level: info

import:
  write: yes
  copy: yes
  move: no
  link: no
  hardlink: no
  reflink: no
  resume: ask
  incremental: yes
  from_scratch: no
  quiet_fallback: skip
  timid: no
  autotag: yes
  quiet: yes
  default_action: apply

clutter: ["Thumbs.DB", ".DS_Store"]
ignore: [".*", "*~", "System Volume Information", "lost+found"]
ignore_hidden: yes

replace:
  '[\\/]': _
  '^\.': _
  '[\x00-\x1f]': _
  '[<>:"\?\*\|]': _
  '\.$': _
  '\s+$': ""
  '^\s+': ""
  "^-": _
path_sep_replace: _
drive_sep_replace: _
asciify_paths: false
art_filename: cover
max_filename_length: 0

aunique:
  keys: albumartist album
  disambiguators: albumtype year label catalognum albumdisambig releasegroupdisambig
  bracket: "[]"

overwrite_null:
  album: []
  track: []

threaded: yes
per_disc_numbering: no
original_date: yes
artist_credit: no
id3v23: no
va_name: "Various Artists"

ui:
  terminal_width: 80
  color: yes

format_item: $artist - $album - $title
format_album: $albumartist - $album
time_format: "%Y-%m-%d %H:%M:%S"

sort_album: albumartist+ album+
sort_item: artist+ album+ disc+ track+
sort_case_insensitive: yes

# Keep paths simple and Navidrome-friendly
paths:
  default: $albumartist/$album%aunique{}/$track $title
  singleton: Non-Album/$artist/$title
  comp: Compilations/$album%aunique{}/$track $title

statefile: state.pickle

# --- PLUGINS ---

pluginpath:
  - /config/.config/beets/plugins

# Added: convert, fetchart, embedart, lyrics, replaygain, scrub
plugins:
  - deezer
  - convert
  - fetchart
  - replaygain
  - scrub
  - edit
  - duplicates
  - info

# Keep MusicBrainz enabled as a fallback; Deezer will be preferred by the plugin
musicbrainz:
  host: musicbrainz.org
  https: no
  ratelimit: 1
  ratelimit_interval: 1.0
  searchlimit: 5
  extra_tags: []
  genres: no
  data_source_mismatch_penalty: 0.5

match:
  strong_rec_thresh: 0.04
  medium_rec_thresh: 0.25
  rec_gap_thresh: 0.25
  max_rec:
    missing_tracks: medium
    unmatched_tracks: medium
  distance_weights:
    source: 2.0
    artist: 3.0
    album: 3.0
    media: 1.0
    mediums: 1.0
    year: 1.0
    country: 0.5
    label: 0.5
    catalognum: 0.5
    albumdisambig: 0.5
    album_id: 5.0
    tracks: 2.0
    missing_tracks: 0.9
    unmatched_tracks: 0.6
    track_title: 3.0
    track_artist: 2.0
    track_index: 1.0
    track_length: 2.0
    track_id: 5.0
  preferred:
    countries: []
    media: []
    original_year: no
  ignored: []
  required: []
  ignored_media: []

  # --- Deezer metadata ---
deezer:
  data_source_mismatch_penalty: 0.0

# --- Conversion to Opus on import ---
convert:
  auto: yes
  format: opus
  copy_album_art: yes
  embed: yes
  threads: 4
  never_convert_lossy_files: yes
  tmpdir: /tmp
  formats:
    opus: ffmpeg -i $source -y -vn -c:a libopus -b:a 160k -vbr on -compression_level 10 -frame_duration 20 $dest

# --- Album art: fetch + embed + save as cover.* ---
fetchart:
  auto: yes # automatically assign art during import (local only)
  sources: filesystem # ONLY look for images already on disk
  store_source: no
  cautious: yes # avoid replacing existing art
  cover_names: cover folder front album art

embedart:
  auto: yes
  maxwidth: 1400
  compare_threshold: 0 # always (re)embed fetched art

# --- Lyrics ---
lyrics:
  auto: yes
  fallback: yes
  # If you have API tokens you can specify sources explicitly, e.g.:
  # sources: genius musixmatch
  # Prefer instrumental detection tags over empty lyrics
  allow_missing: yes
  # strip non-lyric cruft
  clean: yes

# --- ReplayGain for even playback volume ---
replaygain:
  auto: yes
  backend: ffmpeg # uses ffmpeg loudnorm/ebu r128, no external tool needed
  targetlevel: 89 # standard RG reference

  # --- Sanitize embedded tags before writing ---
scrub:
  auto: yes
