# E2E stack: deeznt + Navidrome
#
# First-time setup:
#   docker compose up --build -d
#   docker compose exec -it deeznt deeznt login
#   docker compose exec deeznt deeznt sync start
#
# Then open http://localhost:4533

services:
  deeznt:
    build: .
    environment:
      DEEZNT_SECRET: test
      DEEZNT_FIXTURE_ALBUMS: "502723"
    command: ["daemon", "--config", "/config/config.docker.toml"]
    volumes:
      - ./config.docker.toml:/config/config.docker.toml:ro
      - deeznt-state:/config
      - music:/music
    restart: unless-stopped

  navidrome:
    image: deluan/navidrome:latest
    ports:
      - "4533:4533"
    environment:
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
      ND_LOGLEVEL: info
      ND_SCANSCHEDULE: "@every 1m"
      ND_ENABLETRANSCODINGCONFIG: "true"
    volumes:
      - music:/music:ro
      - navidrome-data:/data
    depends_on:
      - deeznt
    restart: unless-stopped

volumes:
  music:
  deeznt-state:
  navidrome-data:
