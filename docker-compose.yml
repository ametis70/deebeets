# E2E stack: deebeets + Navidrome
#
# First-time setup:
#   docker compose up --build -d
#   docker compose exec -it deebeets deebeets login
#   docker compose exec deebeets deebeets sync start
#
# Then open http://localhost:4533

services:
  deebeets:
    build: .
    environment:
      DEEBEETS_SECRET: test
      DEEBEETS_FIXTURE_ALBUMS: "57783852,796709881,502723"
    command: ["daemon", "--config", "/config/config.docker.toml"]
    volumes:
      - ./config.docker.toml:/config/config.docker.toml:ro
      - deebeets-state:/config
      - music:/music
    restart: unless-stopped

  navidrome:
    image: deluan/navidrome:latest
    ports:
      - "4533:4533"
    environment:
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
      ND_LOGLEVEL: info
      ND_SCANSCHEDULE: "@every 1m"
      ND_ENABLETRANSCODINGCONFIG: "true"
    volumes:
      - music:/music:ro
      - navidrome-data:/data
    depends_on:
      - deebeets
    restart: unless-stopped

volumes:
  music:
  deebeets-state:
  navidrome-data:
