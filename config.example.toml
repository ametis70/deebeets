# deebeets configuration. Copy to config.toml and edit.
# Every value can also be overridden via env vars, e.g.
#   DEEBEETS_DOWNLOAD_CONCURRENCY=5
# Prefer the dedicated DEEBEETS_ARL env var over putting the ARL in this file.

[deezer]
# Your Deezer ARL cookie. Leave empty and export DEEBEETS_ARL instead.
arl = ""
# Formats tried in order; first one the account/track can serve wins.
# FLAC requires a Deezer HiFi subscription.
format_priority = ["FLAC", "MP3_320", "MP3_128"]

[paths]
music_dir   = "./music"
db_path     = "./deebeets.db"
socket_path = "./deebeets.sock"

[sync]
# How often the daemon automatically syncs your Deezer favorites.
# Set to 0 to disable automatic syncing (use `deebeets sync start` manually).
interval = "0s"

[sync.retry]
max_attempts = 3
backoff      = "10s"

[download]
# Tracks downloaded in parallel within a batch.
concurrency       = 3
# Optional pause between batches, e.g. "2s". "0s" disables it.
inter_batch_delay = "0s"
# Automatically start downloading after each sync completes.
auto = false

[download.favorites]
# Default item types pulled by `deebeets sync start` when no flags are given.
albums    = false
artists   = false
playlists = false
tracks    = true

[download.retry]
# Batch-level retries: after all queued items are processed, failed items are
# requeued up to max_attempts times before being permanently marked failed.
max_attempts = 3
backoff      = "5s"

[convert]
# Enable ffmpeg conversion of downloaded files.
enabled = false
# Automatically run conversion after each download run.
auto    = false
# Destination directory for converted files. Defaults to music_dir if empty.
dest    = ""
# Number of files converted in parallel.
concurrency = 2
# Target format name (used for output file extension).
format  = "opus"
# ffmpeg command template. Use $source and $dest as placeholders.
ffmpeg_args = "ffmpeg -i $source -y -vn -c:a libopus -b:a 160k -vbr on -compression_level 10 $dest"

[ratelimit]
# Base backoff after a rate-limit hit (grows exponentially per hit).
cooldown = "30s"
# max_hits within window triggers a hard stop of the download stage.
max_hits = 5
window   = "5m"
# Flat halt duration applied to all stages when a rate limit is hit.
backoff  = "10m"

[tags]
# Baseline tags deebeets writes to downloaded files.
fields = [
  "title", "artist", "albumartist", "album",
  "tracknumber", "totaltracks", "discnumber", "disctotal",
  "date", "genre", "label", "composer", "isrc", "barcode",
  "copyright", "bpm", "replaygain", "comment", "lyrics", "cover",
]
# Go text/template producing the file path relative to music_dir.
# Available fields: AlbumArtist, Album, Artist, Title, Year, Track, TotalTracks,
# Disc, TotalDiscs, MultiDisc, Ext.
naming_template = "{{.AlbumArtist}}/{{.Album}}{{if .Year}} ({{.Year}}){{end}}/{{if .MultiDisc}}{{.Disc}}-{{end}}{{printf \"%02d\" .Track}} {{.Title}}.{{.Ext}}"

# Commands run after a successful convert run. Each string is run via the shell.
posthooks = []
